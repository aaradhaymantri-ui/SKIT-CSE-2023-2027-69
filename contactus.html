<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>
</head>

<body>

    <h1><center>contact us!</center></h1>

    <div class="decorate">

        <form>
            <h1>Customer Registration Form</h1>
            <p>please fill out the form below to register</p>
            <hr>

            <h2>Personal Details</h2>
            <label for="fname">First Name</label>
            <input type="text" name="firstname" placeholder="e.g..Arjun" id="fname" required><br><br>

            <label for="lname">Last Name</label>
            <input type="text" name="lastname" placeholder="e.g..Kumar" id="lname"><br><br>

            <label for="email">Email Address</label>
            <input type="email" name="email" id="email"><br><br>

            <label for="number">Phone Number</label>
            <input type="number" name="number" id="number"><br><br>

            <label for="address">Mailing Address</label><br>
            <textarea name="address" id="address" rows="10" cols="30">Street Address, City, State, zip Code</textarea> <br><br>
            <hr>

            <button type="submit">Register</button>
            <button type="submit">Clear Form</button>

        </form>

    </div>


</body>

</html>
